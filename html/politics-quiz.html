<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成考专升本政治 - 题库</title>
<style>
:root {
  --primary: #1a73e8;
  --primary-light: #e8f0fe;
  --primary-dark: #1557b0;
  --success: #0d904f;
  --success-light: #e6f4ea;
  --error: #d93025;
  --error-light: #fce8e6;
  --warning: #f9ab00;
  --warning-light: #fef7e0;
  --bg: #f8f9fa;
  --card: #ffffff;
  --text: #202124;
  --text-secondary: #5f6368;
  --border: #dadce0;
  --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.15);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  padding: 24px 20px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.header-sub { font-size: 13px; opacity: 0.9; margin-bottom: 12px; }
.stats-bar { display: flex; gap: 12px; flex-wrap: wrap; }
.stat-item {
  background: rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
}
.stat-item strong { font-size: 16px; display: block; }
.toolbar {
  display: flex;
  gap: 8px;
  padding: 12px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
  position: sticky;
  top: 120px;
  z-index: 99;
}
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn:hover { background: var(--primary-light); border-color: var(--primary); }
.btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; border-color: var(--success); }
.btn-success:hover { background: #0b7a43; }
.btn-danger { color: var(--error); border-color: var(--error); }
.btn-danger:hover { background: var(--error-light); }
.container { max-width: 800px; margin: 0 auto; padding: 16px 20px 80px; }
.tab-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 0 16px;
  -webkit-overflow-scrolling: touch;
}
.tab-item {
  padding: 10px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.tab-item:hover { border-color: var(--primary); }
.tab-item.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.question-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow: hidden;
  transition: box-shadow 0.2s;
}
.question-card:hover { box-shadow: var(--shadow-hover); }
.q-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: #fafbfc;
}
.q-id { font-weight: 700; color: var(--primary); font-size: 14px; }
.q-type {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 12px;
  background: var(--primary-light);
  color: var(--primary);
}
.q-type.choice { background: #e8f5e9; color: #2e7d32; }
.q-type.essay { background: #fff3e0; color: #e65100; }
.q-body { padding: 20px; }
.q-stem { font-size: 15px; font-weight: 500; margin-bottom: 16px; white-space: pre-line; }
.q-options { display: flex; flex-direction: column; gap: 10px; }
.option-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  font-size: 14px;
}
.option-item:hover { border-color: var(--primary); background: var(--primary-light); }
.option-item.selected { border-color: var(--primary); background: var(--primary-light); }
.option-item.correct { border-color: var(--success); background: var(--success-light); }
.option-item.wrong { border-color: var(--error); background: var(--error-light); }
.option-radio {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  transition: all 0.2s;
}
.option-item.selected .option-radio { border-color: var(--primary); background: var(--primary); }
.option-item.correct .option-radio { border-color: var(--success); background: var(--success); }
.option-item.wrong .option-radio { border-color: var(--error); background: var(--error); }
.q-textarea-wrap textarea {
  width: 100%;
  min-height: 100px;
  padding: 12px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  transition: border-color 0.2s;
}
.q-textarea-wrap textarea:focus { border-color: var(--primary); outline: none; }
.result-indicator {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  display: none;
}
.result-indicator.show { display: block; }
.result-indicator.correct { background: var(--success-light); color: var(--success); }
.result-indicator.wrong { background: var(--error-light); color: var(--error); }
.q-actions {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.q-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.q-answer.show { max-height: 800px; }
.answer-box {
  margin: 0 20px 20px;
  padding: 16px;
  background: #f0f7ff;
  border-radius: 10px;
  border-left: 4px solid var(--primary);
  font-size: 14px;
}
.answer-box .label {
  font-weight: 700;
  color: var(--primary);
  font-size: 13px;
  margin-bottom: 6px;
}
.answer-box .content { white-space: pre-line; }
.topic-label {
  font-size: 16px;
  font-weight: 700;
  padding: 12px 0 8px;
  color: var(--primary-dark);
}
.progress-ring-wrap {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 64px;
  height: 64px;
  cursor: pointer;
  z-index: 50;
}
.progress-ring { transform: rotate(-90deg); }
.progress-ring-bg { fill: none; stroke: #e0e0e0; stroke-width: 5; }
.progress-ring-fill {
  fill: none;
  stroke: var(--primary);
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease;
}
.progress-ring-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
}
.scroll-top-btn {
  position: fixed;
  bottom: 24px;
  left: 24px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  border: none;
  font-size: 20px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 50;
}
.scroll-top-btn.show { display: flex; }
.review-card { border-left: 4px solid var(--error) !important; }
@media (max-width: 600px) {
  .header { padding: 18px 16px 16px; }
  .header h1 { font-size: 19px; }
  .container { padding: 12px 14px 80px; }
  .toolbar { padding: 10px 14px; }
  .btn { padding: 7px 12px; font-size: 12px; }
  .q-body { padding: 14px; }
  .q-stem { font-size: 14px; }
  .option-item { padding: 9px 12px; font-size: 13px; }
  .stat-item { padding: 5px 10px; font-size: 12px; }
  .stat-item strong { font-size: 14px; }
  .tab-item { padding: 9px 14px; font-size: 13px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>成考专升本政治 - 题库</h1>
  <div class="header-sub">共 <strong id="totalQ">0</strong> 题 | 选择题 <strong id="totalChoice">0</strong> 题 · 简答题 <strong id="totalEssay">0</strong> 题</div>
  <div class="stats-bar">
    <div class="stat-item">已答 <strong id="statAnswered">0</strong> / <strong id="statTotal">0</strong></div>
    <div class="stat-item">正确率 <strong id="statAccuracy">0%</strong></div>
    <div class="stat-item">错题 <strong id="statWrong">0</strong> 题</div>
  </div>
</div>

<div class="toolbar">
  <button class="btn" id="btnSeq" onclick="setOrder('seq')">📖 顺序练习</button>
  <button class="btn active" id="btnRand" onclick="setOrder('rand')">🔀 随机练习</button>
  <div style="flex:1"></div>
  <button class="btn btn-danger" id="btnReview" onclick="showReview()">📌 错题本 (<span id="wrongCount">0</span>)</button>
  <button class="btn" id="btnShowAll" onclick="toggleShowAll()">👁 全部显示答案</button>
  <button class="btn" onclick="resetAll()">🔄 重置</button>
</div>

<div class="container" id="mainContainer">
  <div class="tab-bar" id="tabBar"></div>
  <div id="questionList"></div>
  <div id="reviewPanel" style="display:none"></div>
</div>

<div class="progress-ring-wrap" id="progressRing" onclick="scrollToNext()" title="跳转下一题">
  <svg class="progress-ring" width="64" height="64">
    <circle class="progress-ring-bg" cx="32" cy="32" r="28"/>
    <circle class="progress-ring-fill" id="ringFill" cx="32" cy="32" r="28"
      stroke-dasharray="175.93" stroke-dashoffset="175.93"/>
  </svg>
  <div class="progress-ring-text" id="ringText">0%</div>
</div>

<button class="scroll-top-btn" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ===================== QUESTION DATA (from JSON) =====================
const questions = [
  {
    "id": 1,
    "type": "choice",
    "topic": "哲学基础",
    "stem": "哲学的基本问题是（    ）",
    "options": [
      "A.实践和认识的关系问题",
      "B.思维和存在的关系问题",
      "C.自然和社会的关系问题",
      "D.运动和静止的关系问题"
    ],
    "answer": "B",
    "explanation": "哲学的基本问题指的是思维和存在的关系问题。"
  },
  {
    "id": 2,
    "type": "choice",
    "topic": "哲学基础",
    "stem": "世界的统一性在于（    ）",
    "options": [
      "A.存在性",
      "B.可知性",
      "C.物质性",
      "D.精神性"
    ],
    "answer": "C",
    "explanation": "世界的统一性问题，是回答世界上的万事万物有没有统一性，即有没有共同的本质或本原的问题。马克思主义认为，物质是世界的本原，社会运动也是物质运动的一种特殊形式，世界统一于物质。"
  },
  {
    "id": 3,
    "type": "choice",
    "topic": "对立统一规律",
    "stem": "没有上，就无所谓下；没有先进，就无所谓落后；没有正确，就无所谓错误。这说明（    ）",
    "options": [
      "A.矛盾双方是相互排斥的",
      "B.矛盾双方是相互转化的",
      "C.矛盾双方是相互依存的",
      "D.矛盾双方是相互渗透的"
    ],
    "answer": "C",
    "explanation": "\"下\"因\"上\"而存在，\"落后\"因\"先进\"而存在，\"错误\"因\"正确\"而存在，这些本来是相互矛盾的双方，其中一方的存在以另一方为依据，生动地说明矛盾双方是相互依存的，故选C项。"
  },
  {
    "id": 4,
    "type": "choice",
    "topic": "对立统一规律",
    "stem": "和谐是矛盾的一种特殊表现形式，体现着矛盾双方的（    ）",
    "options": [
      "A.绝对同一",
      "B.相互分离",
      "C.相互依存",
      "D.绝对排斥"
    ],
    "answer": "C",
    "explanation": "和谐是矛盾的一种特殊表现形式，体现着矛盾双方的相互依存、相互促进、共同发展，和谐并不意味着矛盾的绝对同一。和谐是相对的、有条件的，只有在矛盾双方处于平衡、协调、合作的情况下，事物才展现出和谐状态。"
  },
  {
    "id": 5,
    "type": "choice",
    "topic": "认识论",
    "stem": "认识的高级阶段是（    ）",
    "options": [
      "A.感性认识",
      "B.理性认识",
      "C.直接认识",
      "D.间接认识"
    ],
    "answer": "B",
    "explanation": "理性认识是人们通过抽象思维而得到的关于事物的本质、事物的全体和内在联系的认识，具有间接性和抽象性的特点，是认识发展的高级阶段。"
  },
  {
    "id": 6,
    "type": "choice",
    "topic": "认识论",
    "stem": "割裂感性认识和理性认识的辩证统一，会导致两种错误理论，一种是经验论，另一种是（    ）",
    "options": [
      "A.唯理论",
      "B.庸俗进化论",
      "C.激变论",
      "D.庸俗唯物论"
    ],
    "answer": "A",
    "explanation": "感性认识和理性认识在实践的基础上达到辩证统一，若割裂感性认识和理性认识的统一，则会导致唯理论和经验论的错误。"
  },
  {
    "id": 7,
    "type": "choice",
    "topic": "认识论",
    "stem": "一个完整的认识过程需要经过两次飞跃，下列各项属于第一次飞跃的是（    ）",
    "options": [
      "A.从实践到认识",
      "B.从感觉到知觉",
      "C.从认识到实践",
      "D.从概念到判断"
    ],
    "answer": "A",
    "explanation": "认识的过程首先是从实践到认识的过程。这个过程主要表现为在实践基础上认识活动由感性认识能动地飞跃到理性认识，也就是\"从生动的直观到抽象的思维\"，这是认识运动的第一次飞跃。"
  },
  {
    "id": 8,
    "type": "choice",
    "topic": "社会基本矛盾",
    "stem": "社会发展的基本矛盾是（    ）",
    "options": [
      "A.生产力与生产关系、经济基础与上层建筑的矛盾",
      "B.无产阶级与资产阶级的矛盾",
      "C.社会主义与资本主义的矛盾",
      "D.先进与落后的矛盾"
    ],
    "answer": "A",
    "explanation": "生产力和生产关系的矛盾、经济基础和上层建筑的矛盾这两对矛盾交互作用形成了社会基本矛盾运动。"
  },
  {
    "id": 9,
    "type": "choice",
    "topic": "马克思主义中国化",
    "stem": "第一次正式提出\"马克思主义的中国化\"这一命题是在（    ）",
    "options": [
      "A.党的七大",
      "B.党的六大",
      "C.六届六中全会",
      "D.六届七中全会"
    ],
    "answer": "C",
    "explanation": "1938年，党的六届六中全会，毛泽东在《论新阶段》的报告中，正式提出\"马克思主义的中国化\"这一命题。"
  },
  {
    "id": 10,
    "type": "choice",
    "topic": "马克思主义中国化",
    "stem": "邓小平理论回答的首要的基本的理论问题是（    ）",
    "options": [
      "A.实现什么样的发展，怎样发展",
      "B.什么是社会主义，怎样建设社会主义",
      "C.建设什么样的党，怎样建设党",
      "D.新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义"
    ],
    "answer": "B",
    "explanation": "邓小平理论回答的首要的基本的理论问题是什么是社会主义，怎样建设社会主义。"
  },
  {
    "id": 11,
    "type": "choice",
    "topic": "毛泽东思想",
    "stem": "毛泽东首次提出中国共产党的三大优良作风的党的会议是（    ）",
    "options": [
      "A.中共六届六中全会",
      "B.中共七大",
      "C.中共七届二中全会",
      "D.中共八大"
    ],
    "answer": "B",
    "explanation": "毛泽东在1945年召开的中共七大政治报告中提出了\"理论联系实践的作风、密切联系群众的作风、批评和自我批评的作风\"三大优良作风。"
  },
  {
    "id": 12,
    "type": "choice",
    "topic": "毛泽东思想",
    "stem": "毛泽东思想的活的灵魂是（    ）\n①实事求是 ②群众路线 ③与时俱进 ④独立自主",
    "options": [
      "A.①②④",
      "B.①③④",
      "C.①②③",
      "D.②③④"
    ],
    "answer": "A",
    "explanation": "毛泽东思想的活的灵魂是实事求是、群众路线和独立自主。"
  },
  {
    "id": 13,
    "type": "choice",
    "topic": "新民主主义革命",
    "stem": "在中国新民主主义革命队伍中，处于领导地位的是（    ）",
    "options": [
      "A.农民阶级",
      "B.民族资产阶级",
      "C.工人阶级",
      "D.城市小资产阶级"
    ],
    "answer": "C",
    "explanation": "中国工人阶级是新民主主义革命的领导力量。"
  },
  {
    "id": 14,
    "type": "choice",
    "topic": "习近平新时代中国特色社会主义思想",
    "stem": "中国特色社会主义事业总体布局和战略布局分别是（    ）",
    "options": [
      "A.\"两个转变\"和\"一体两翼\"",
      "B.\"五位一体\"和\"四个全面\"",
      "C.\"八个明确\"和\"四面八方\"",
      "D.\"一个中心\"和\"五湖四海\""
    ],
    "answer": "B",
    "explanation": "中国特色社会主义事业总体布局是\"五位一体\"，战略布局是\"四个全面\"。"
  },
  {
    "id": 15,
    "type": "essay",
    "topic": "过渡时期总路线",
    "stem": "简述党在过渡时期总路线的内容及其内在关系。",
    "answer": "（1）党在过渡时期的总路线，以\"一化三改\"为核心，包括两方面的内容：一是逐步实现社会主义工业化，这是总路线的主体；二是逐步实现对农业、手工业和资本主义工商业的社会主义改造，这是总路线的两翼。\n（2）工业化是社会主义改造的基础和目的；社会主义改造是工业化不可缺少的条件和手段，这两方面互相联系，互相促进，互相制约，体现了发展生产力和变革生产关系的有机统一，是一条社会主义建设和社会主义改造同时并举的路线。"
  },
  {
    "id": 16,
    "type": "essay",

// ===================== STATE =====================
const topics = [...new Set(questions.map(q => q.topic))];
let answered = {};
let wrongIds = new Set();
let order = "rand";
let shuffled = [];
let activeTab = "全部";
let showAll = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  document.getElementById("totalQ").textContent = questions.length;
  document.getElementById("totalChoice").textContent = questions.filter(q=>q.type==="choice").length;
  document.getElementById("totalEssay").textContent = questions.filter(q=>q.type==="essay").length;
  document.getElementById("statTotal").textContent = questions.length;
  buildTabs();
  reshuffle();
  render();
}

function buildTabs() {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  const allTab = ["全部", ...topics];
  allTab.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "tab-item" + (t === activeTab ? " active" : "");
    btn.textContent = t;
    btn.onclick = () => { activeTab = t; buildTabs(); render(); };
    bar.appendChild(btn);
  });
}

function reshuffle() {
  if (order === "rand") {
    shuffled = shuffle(questions);
  } else {
    shuffled = [...questions];
  }
}

function setOrder(o) {
  order = o;
  document.getElementById("btnSeq").classList.toggle("active", o === "seq");
  document.getElementById("btnRand").classList.toggle("active", o === "rand");
  reshuffle();
  render();
}

function render() {
  const list = document.getElementById("questionList");
  const review = document.getElementById("reviewPanel");
  review.style.display = "none";
  list.innerHTML = "";

  const visible = order === "rand" ? shuffled : questions;
  const filtered = activeTab === "全部" ? visible : visible.filter(q => q.topic === activeTab);

  let lastTopic = "";
  filtered.forEach(q => {
    if (activeTab === "全部" && q.topic !== lastTopic) {
      lastTopic = q.topic;
      const label = document.createElement("div");
      label.className = "topic-label";
      label.textContent = "📚 " + q.topic;
      list.appendChild(label);
    }
    list.appendChild(buildCard(q, false));
  });
}

function buildCard(q, isReview) {
  const card = document.createElement("div");
  card.className = "question-card" + (isReview ? " review-card" : "");
  card.id = "q-" + q.id + (isReview ? "-r" : "");
  const ans = answered[q.id];

  const header = document.createElement("div");
  header.className = "q-header";
  header.innerHTML = '<span class="q-id">第 ' + q.id + ' 题</span><span class="q-type ' + q.type + '">' + (q.type === 'choice' ? '选择题' : '简答题') + ' · ' + q.topic + '</span>';
  card.appendChild(header);

  const body = document.createElement("div");
  body.className = "q-body";

  const stem = document.createElement("div");
  stem.className = "q-stem";
  stem.textContent = q.stem;
  body.appendChild(stem);

  if (q.type === "choice") {
    const optWrap = document.createElement("div");
    optWrap.className = "q-options";
    q.options.forEach(opt => {
      const item = document.createElement("div");
      item.className = "option-item";
      const letter = opt.charAt(0);
      if (ans) {
        if (letter === q.answer) item.classList.add("correct");
        if (ans.userAnswer === letter && letter !== q.answer) item.classList.add("wrong");
      } else if (!isReview) {
        item.onclick = () => selectOption(q.id, letter, card, q);
      }
      item.innerHTML = '<div class="option-radio"></div><div>' + opt + '</div>';
      optWrap.appendChild(item);
    });
    body.appendChild(optWrap);
  } else {
    const tw = document.createElement("div");
    tw.className = "q-textarea-wrap";
    const ta = document.createElement("textarea");
    ta.placeholder = "请输入你的答案...";
    ta.id = "ta-" + q.id + (isReview ? "-r" : "");
    if (ans) ta.value = ans.userAnswer;
    tw.appendChild(ta);
    body.appendChild(tw);
  }

  card.appendChild(body);

  if (ans) {
    const ri = document.createElement("div");
    ri.className = "result-indicator show " + (ans.correct ? "correct" : "wrong");
    ri.textContent = ans.correct ? "✅ 回答正确！" : "❌ 回答错误";
    card.appendChild(ri);
  }

  const actions = document.createElement("div");
  actions.className = "q-actions";
  if (q.type === "essay" && !ans) {
    const btnSubmit = document.createElement("button");
    btnSubmit.className = "btn btn-primary";
    btnSubmit.textContent = "提交答案";
    btnSubmit.onclick = () => submitEssay(q.id, card, q);
    actions.appendChild(btnSubmit);
  }
  const btnShow = document.createElement("button");
  btnShow.className = "btn btn-success";
  btnShow.textContent = "显示答案";
  btnShow.onclick = () => toggleAnswer(q.id, card);
  actions.appendChild(btnShow);
  card.appendChild(actions);

  const answerDiv = document.createElement("div");
  answerDiv.className = "q-answer" + (showAll ? " show" : "");
  answerDiv.id = "ans-" + q.id + (isReview ? "-r" : "");
  const box = document.createElement("div");
  box.className = "answer-box";
  if (q.type === "choice") {
    box.innerHTML = '<div class="label">正确答案</div><div class="content"><strong>' + q.answer + '</strong></div><div class="label" style="margin-top:10px">解析</div><div class="content">' + q.explanation + '</div>';
  } else {
    box.innerHTML = '<div class="label">参考答案</div><div class="content">' + q.answer.replace(/\n/g, '<br>') + '</div>';
  }
  answerDiv.appendChild(box);
  card.appendChild(answerDiv);

  return card;
}

function selectOption(qid, letter, card, q) {
  if (answered[qid]) return;
  const correct = letter === q.answer;
  answered[qid] = { userAnswer: letter, correct };
  if (!correct) wrongIds.add(qid); else wrongIds.delete(qid);
  updateStats();
  render();
  showAns(qid, card);
}

function submitEssay(qid, card, q) {
  const ta = document.getElementById("ta-" + qid);
  if (!ta || !ta.value.trim()) { alert("请先输入你的答案"); return; }
  answered[qid] = { userAnswer: ta.value.trim(), correct: true };
  updateStats();
  render();
  showAns(qid, card);
}

function toggleAnswer(qid, card) {
  const el = card.querySelector(".q-answer");
  el.classList.toggle("show");
}

function showAns(qid, card) {
  const el = card.querySelector(".q-answer");
  if (el) el.classList.add("show");
}

function toggleShowAll() {
  showAll = !showAll;
  const btn = document.getElementById("btnShowAll");
  btn.classList.toggle("active", showAll);
  btn.textContent = showAll ? "👁 隐藏所有答案" : "👁 全部显示答案";
  document.querySelectorAll(".q-answer").forEach(el => {
    el.classList.toggle("show", showAll);
  });
}

function updateStats() {
  const total = questions.length;
  const answeredCount = Object.keys(answered).length;
  const correctCount = Object.values(answered).filter(a => a.correct).length;
  const accuracy = answeredCount > 0 ? Math.round(correctCount / answeredCount * 100) : 0;

  document.getElementById("statAnswered").textContent = answeredCount;
  document.getElementById("statAccuracy").textContent = accuracy + "%";
  document.getElementById("statWrong").textContent = wrongIds.size;
  document.getElementById("wrongCount").textContent = wrongIds.size;

  const pct = total > 0 ? answeredCount / total : 0;
  const circ = 175.93;
  document.getElementById("ringFill").style.strokeDashoffset = circ * (1 - pct);
  document.getElementById("ringText").textContent = Math.round(pct * 100) + "%";
}

function showReview() {
  const list = document.getElementById("questionList");
  const review = document.getElementById("reviewPanel");
  list.innerHTML = "";
  review.style.display = "block";
  review.innerHTML = "";

  if (wrongIds.size === 0) {
    review.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)"><p style="font-size:48px;margin-bottom:12px">🎉</p><p style="font-size:16px;font-weight:600">太棒了！没有错题！</p></div>';
    return;
  }

  const title = document.createElement("div");
  title.className = "topic-label";
  title.textContent = "📌 错题回顾（共 " + wrongIds.size + " 题）";
  review.appendChild(title);

  wrongIds.forEach(qid => {
    const q = questions.find(x => x.id === qid);
    if (q) review.appendChild(buildCard(q, true));
  });
}

function resetAll() {
  if (!confirm("确定要重置所有答题记录吗？")) return;
  answered = {};
  wrongIds.clear();
  showAll = false;
  document.getElementById("btnShowAll").classList.remove("active");
  document.getElementById("btnShowAll").textContent = "👁 全部显示答案";
  updateStats();
  reshuffle();
  render();
}

function scrollToNext() {
  const cards = document.querySelectorAll(".question-card:not(.hidden)");
  for (const card of cards) {
    const rect = card.getBoundingClientRect();
    if (rect.top > 160) {
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
  }
}

window.addEventListener("scroll", () => {
  document.getElementById("scrollTopBtn").classList.toggle("show", window.scrollY > 400);
});

init();
</script>
